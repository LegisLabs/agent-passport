<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent Passport{% endblock %} — Agent Passport · payments</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:,">
</head>
<body data-view="{{ view }}">
<a href="#main" class="skip">Skip to main content</a>

<header class="masthead" role="banner">
  <div class="wrap masthead__row">
    <a class="masthead__logo" href="/" aria-label="GOV DEMO home">
      <svg class="masthead__crown" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><g fill="#fff"><circle cx="256" cy="100" r="28"/><circle cx="28" cy="184" r="28"/><circle cx="484" cy="184" r="28"/><path d="M256 122 L342 285 L470 200 L410 385 L256 356 L102 385 L42 200 L170 285 Z"/><path d="M106 405 L256 375 L406 405 L396 436 L256 408 L116 436 Z"/></g></svg>
      <span class="masthead__logotype">GOV<span class="masthead__dot" aria-hidden="true"></span>DEMO</span>
    </a>
    <span class="masthead__tag">Prototype v{{ version }}</span>
  </div>
</header>

{% block hero %}{% endblock %}
<div class="wrap shell{% if view == 'home' %} shell--solo{% endif %}">
  {% if view != 'home' %}<nav class="sidenav" id="sidenav" aria-label="Dashboards">
    <ul>
      <li><a href="/provider" {% if view == 'provider' %}aria-current="page"{% endif %}>Provider Panel</a></li>
      <li><a href="/regulator" {% if view == 'regulator' %}aria-current="page"{% endif %}>Regulator Panel</a></li>
      <li><a href="/customer" {% if view == 'customer' %}aria-current="page"{% endif %}>Customer Panel</a></li>
      <li><a href="/bank" {% if view == 'bank' %}aria-current="page"{% endif %}>Action Terminal</a></li>
      <li><a href="/audit" {% if view == 'audit' %}aria-current="page"{% endif %}>Audit</a></li>
      <li><a href="/about" {% if view == 'about' %}aria-current="page"{% endif %}>About</a></li>
    </ul>
  </nav>{% endif %}
  <main id="main" class="main">
{% block content %}{% endblock %}
  </main>
</div>

<footer class="footer">
  <div class="wrap footer__row">
    <span>Legis Labs</span>
    <button class="link" id="demo-reset" type="button">Reset demo</button>
  </div>
</footer>

<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
