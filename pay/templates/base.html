<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent Passport{% endblock %} — Agent Passport · payments</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:,">
</head>
<body data-view="{{ view }}">
<a href="#main" class="skip">Skip to main content</a>

<header class="masthead" role="banner">
  <div class="wrap masthead__row">
    <a class="masthead__logo" href="/provider" aria-label="GOV DEMO home">
      <span class="masthead__square" aria-hidden="true"></span>
      <span class="masthead__logotype">GOV<span class="masthead__dot" aria-hidden="true"></span>DEMO</span>
    </a>
    <span class="masthead__tag">Prototype v{{ version }} · payments</span>
  </div>
</header>

<nav class="tabs" aria-label="Dashboards">
  <div class="wrap tabs__row">
    <a class="tabs__tab" href="/provider" {% if view == 'provider' %}aria-current="page"{% endif %}>Provider Panel</a>
    <a class="tabs__tab" href="/regulator" {% if view == 'regulator' %}aria-current="page"{% endif %}>Regulator Panel</a>
    <a class="tabs__tab" href="/customer" {% if view == 'customer' %}aria-current="page"{% endif %}>Customer Panel</a>
    <a class="tabs__tab" href="/bank" {% if view == 'bank' %}aria-current="page"{% endif %}>Action Terminal</a>
    <a class="tabs__tab" href="/audit" {% if view == 'audit' %}aria-current="page"{% endif %}>Audit</a>
    <a class="tabs__tab tabs__tab--about" href="/about" {% if view == 'about' %}aria-current="page"{% endif %}>About</a>
  </div>
</nav>

<main id="main" class="wrap main">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="wrap footer__row">
    <span>Legis Labs</span>
    <button class="link" id="demo-reset" type="button">Reset demo</button>
  </div>
</footer>

<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
