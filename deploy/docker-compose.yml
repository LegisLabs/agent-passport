# Agent Passport: three containers, one repo.
#   cdir-bank  Agent Passport, bank-first (cdir.legislabs.uk)            branch bank-first-pivot, pay/
#   cdir-pay   the pre-pivot payments demo (pay.cdir.legislabs.uk)       kept running for comparison; not rebuilt by `publish.sh bank`
#   cdir       the tax demonstrator (cdir.legislabs.uk/tax/, basic-auth)  app/, frozen since v1, served under a path prefix
# Ports 80/443 on the box belong to the Compass Caddy (/opt/compass/deploy); all apps join that
# compose network so Caddy can reverse_proxy to them by container name. Site configs are the
# drop-ins /opt/caddy-sites/cdir-legislabs.caddy and /opt/caddy-sites/pay-cdir-legislabs.caddy.
services:
  cdir:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: cdir
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EXTRACTION_MODE: ${EXTRACTION_MODE:-gemini}
      ROOT_PATH: /tax
    volumes:
      - cdir_data:/data
    restart: unless-stopped

  cdir-pay:
    build:
      context: ..
      dockerfile: deploy/pay.Dockerfile
    container_name: cdir-pay
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EXTRACTION_MODE: ${EXTRACTION_MODE:-gemini}
      HACKATHON_ORG_API_KEY: ${HACKATHON_ORG_API_KEY:-}
      API_BASE_URL: ${API_BASE_URL:-https://cdir.vouch.finance/api/v1}
      VOUCH_MODE: ${VOUCH_MODE:-fixture}
      PAYMENT_RAIL: ${PAYMENT_RAIL:-local}
      VOUCH_PROGRAM_ID: ${VOUCH_PROGRAM_ID:-}
      VOUCH_PRIVY_USER_ID: ${VOUCH_PRIVY_USER_ID:-}
      VOUCH_MERCHANTS: ${VOUCH_MERCHANTS:-{}}
      VOUCH_CATEGORY: ${VOUCH_CATEGORY:-SUPPLIES}
    volumes:
      - cdir_pay_data:/data
    restart: unless-stopped

  cdir-bank:
    build:
      context: ..
      dockerfile: deploy/pay.Dockerfile
    container_name: cdir-bank
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EXTRACTION_MODE: ${EXTRACTION_MODE:-gemini}
      HACKATHON_ORG_API_KEY: ${HACKATHON_ORG_API_KEY:-}
      API_BASE_URL: ${API_BASE_URL:-https://cdir.vouch.finance/api/v1}
      VOUCH_MODE: ${VOUCH_MODE:-fixture}
      PAYMENT_RAIL: ${PAYMENT_RAIL:-local}
      VOUCH_PROGRAM_ID: ${VOUCH_PROGRAM_ID:-}
      VOUCH_PRIVY_USER_ID: ${VOUCH_PRIVY_USER_ID:-}
      VOUCH_MERCHANTS: ${VOUCH_MERCHANTS:-{}}
      VOUCH_CATEGORY: ${VOUCH_CATEGORY:-SUPPLIES}
    volumes:
      - cdir_bank_data:/data
    restart: unless-stopped

volumes:
  cdir_data:
  cdir_pay_data:
  cdir_bank_data:

networks:
  default:
    name: deploy_default
    external: true
